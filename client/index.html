<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    
    <!-- Page Title -->
    <title>Gariyangu - Kenya Motor Vehicle Duty Calculator & Car Marketplace</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    
    <!-- Meta Description -->
    <meta name="description" content="Calculate Kenya Revenue Authority (KRA) import duties and taxes for motor vehicles. Browse Kenya's premier car marketplace with duty calculator, vehicle loans, and expert automotive services." />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Gariyangu - Kenya Motor Vehicle Duty Calculator" />
    <meta property="og:description" content="Calculate KRA import duties, browse cars, and access comprehensive automotive services in Kenya." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gariyangu" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gariyangu - Kenya Motor Vehicle Duty Calculator" />
    <meta name="twitter:description" content="Calculate KRA import duties, browse cars, and access comprehensive automotive services in Kenya." />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#8B5CF6" />
    
    <!-- Keywords -->
    <meta name="keywords" content="Kenya, KRA, import duty, vehicle calculator, car marketplace, motor vehicle, customs, tax calculator, automotive, Gariyangu" />
    
    <!-- Author -->
    <meta name="author" content="Gariyangu" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <script src="https://js.paystack.co/v1/inline.js"></script>
  </head>
  <body>
    <div id="root">
      <div style="
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        min-height: 100vh; 
        background: linear-gradient(135deg, #8B5CF6, #06B6D4); 
        color: white; 
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 2rem;
      ">
        <div style="font-size: 4rem; margin-bottom: 2rem;">🚗</div>
        <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">Gariyangu</h1>
        <p style="font-size: 1.2rem; opacity: 0.9; margin-bottom: 2rem;">Kenya Motor Vehicle Duty Calculator & Car Marketplace</p>
        <div style="display: flex; gap: 1rem; margin-bottom: 2rem;">
          <div style="width: 8px; height: 8px; background: white; border-radius: 50%; animation: pulse 1.5s infinite;"></div>
          <div style="width: 8px; height: 8px; background: white; border-radius: 50%; animation: pulse 1.5s infinite 0.3s;"></div>
          <div style="width: 8px; height: 8px; background: white; border-radius: 50%; animation: pulse 1.5s infinite 0.6s;"></div>
        </div>
        <p style="opacity: 0.7;">Loading your marketplace...</p>
        <button onclick="window.location.href='/app-direct.html'" style="
          background: white; 
          color: #8B5CF6; 
          border: none; 
          padding: 12px 24px; 
          border-radius: 8px; 
          cursor: pointer; 
          margin-top: 2rem;
          font-size: 1rem;
        ">Access Direct Version</button>
      </div>
    </div>
    <style>
      @keyframes pulse {
        0%, 80%, 100% { opacity: 0.3; }
        40% { opacity: 1; }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
