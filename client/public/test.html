<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gariyangu - Test Page</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
        body { 
            font-family: system-ui, sans-serif; 
            text-align: center; 
            padding: 50px;
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            color: white;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .logo { font-size: 3rem; margin-bottom: 1rem; }
        .status { font-size: 1.2rem; margin: 1rem 0; }
        .test-btn { 
            background: white; 
            color: #8B5CF6; 
            padding: 12px 24px; 
            border: none; 
            border-radius: 8px; 
            font-size: 1.1rem;
            cursor: pointer;
            margin: 10px;
        }
        .test-btn:hover { background: #f3f4f6; }
    </style>
</head>
<body>
    <div class="logo">🚗 Gariyangu</div>
    <h1>Kenya Motor Vehicle Duty Calculator & Car Marketplace</h1>
    <div class="status">✅ Server Status: Running</div>
    <div class="status">✅ Custom Favicon: Working</div>
    <div class="status">✅ Backend APIs: Ready</div>
    <div class="status">⚠️ React App: Loading Issue Detected</div>
    
    <button class="test-btn" onclick="testAPI()">Test API Connection</button>
    <button class="test-btn" onclick="goToMain()">Try Main App</button>
    
    <div id="api-result" style="margin-top: 20px;"></div>
    
    <script>
        async function testAPI() {
            const result = document.getElementById('api-result');
            try {
                const response = await fetch('/api/auth/session');
                const data = await response.text();
                result.innerHTML = `<div style="background: rgba(255,255,255,0.2); padding: 15px; border-radius: 8px; margin-top: 10px;">
                    ✅ API Test Successful<br>
                    Response: ${response.status} ${response.statusText}
                </div>`;
            } catch (error) {
                result.innerHTML = `<div style="background: rgba(255,0,0,0.3); padding: 15px; border-radius: 8px; margin-top: 10px;">
                    ❌ API Test Failed: ${error.message}
                </div>`;
            }
        }
        
        function goToMain() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
